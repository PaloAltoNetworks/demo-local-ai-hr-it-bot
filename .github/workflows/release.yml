# Publishing a GitHub release builds the five demo images, pushes them to GHCR tagged
# with the release tag (plus sha-<commit>), then deploys that version: a pre-release to the
# preview (gcp), a release to production (aws). Manual runs build and deploy the checked-out
# ref under the given tag to the chosen cloud.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish and deploy (e.g. v0.1.1)
        required: true
      cloud:
        description: aws (production) or gcp (preview)
        type: choice
        options: [aws, gcp]
        default: aws

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: chatbot-v2, dockerfile: chatbot-v2/Dockerfile }
          - { image: hr-tools-mcp-server, dockerfile: mcp-server/hr-tools-mcp-server/Dockerfile }
          - { image: it-tools-mcp-server, dockerfile: mcp-server/it-tools-mcp-server/Dockerfile }
          - { image: it-triage-agent, dockerfile: agents/it-triage-agent/Dockerfile }
          - { image: auth-service, dockerfile: auth-service/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version || github.event.release.tag_name }}
            type=sha
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      cloud: ${{ github.event.release.prerelease && 'gcp' || inputs.cloud || 'aws' }}
      version: ${{ inputs.version || github.event.release.tag_name }}
