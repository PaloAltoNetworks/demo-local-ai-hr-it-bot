# Idira Secure Workload Access agent (chart swa-agent), release "swa-agent" in
# namespace swa-system, so its ServiceAccount swa-system:swa-agent matches the server
# group's k8s_psat service_account_allow_list. trustDomain.name, bootstrap.bundleSourceUrl,
# nodeAttestor.k8s_psat.cluster and podLabels.swa_nodegroup are tenant-specific and come
# from the hr-it-bot-swa secret at install time. EKS node names do not resolve, so the
# agent reaches its kubelet on 127.0.0.1 (setNodeNameEnv: false, hostNetwork).
# image.repository (<account>.dkr.ecr.<region>.amazonaws.com/swa/swa-agent) is set at
# install time from the deploying AWS identity, so no account ID lives in git.
image:
  tag: "1.1.3"

server:
  address: swa-server.default.svc.cluster.local:8443

setNodeNameEnv: false

nodeSelector:
  kubernetes.io/arch: amd64

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
