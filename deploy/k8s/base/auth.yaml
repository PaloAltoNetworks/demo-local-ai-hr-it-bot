# Front door: cloudflared -> caddy -> (forward_auth auth-service) -> chatbot-v2.
# auth-service keeps users, sessions and pending magic links in SQLite on a volume,
# so it runs as a single replica and is recreated (never two pods on one volume).
# Hostnames, cookie settings and the allowed email domain come from the "edge"
# ConfigMap of the overlay; SMTP credentials and AUTH_SECRET from the auth Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.4-alpine
          ports: [{ containerPort: 3010 }]
          envFrom: [{ configMapRef: { name: edge } }]
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
          readinessProbe: { tcpSocket: { port: 3010 } }
          livenessProbe: { tcpSocket: { port: 3010 } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: caddyfile, configMap: { name: caddyfile } }
        - { name: data, emptyDir: {} }
        - { name: config, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  selector: { app: caddy }
  ports: [{ port: 3010, targetPort: 3010 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/paloaltonetworks/demo-local-ai-hr-it-bot/auth-service
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: edge }
            - secretRef: { name: auth }
          env:
            - { name: SITE_URL, value: "https://$(AUTH_HOST)" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /auth/whoami, port: 3001 } }
          livenessProbe: { httpGet: { path: /auth/whoami, port: 3001 } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: auth-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
