# Kubernetes Secrets synced by External Secrets Operator from the cloud secret manager.
# The store "cloud-secrets" is defined per cloud in overlays/<cloud>; the remote keys
# are the same everywhere (hr-it-bot-*, created by infra/<cloud>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-env
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target: { name: app-env }
  dataFrom:
    - extract: { key: hr-it-bot-app-env }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airs-gw-env
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target: { name: airs-gw-env }
  data:
    - secretKey: PORTKEY_CLIENT_AUTH
      remoteRef: { key: hr-it-bot-airs-gw, property: PORTKEY_CLIENT_AUTH }
    - secretKey: ORGANISATIONS_TO_SYNC
      remoteRef: { key: hr-it-bot-airs-gw, property: ORGANISATIONS_TO_SYNC }
    # RSA key the gateway signs forwarded identities (X-User-JWT) with; it publishes the
    # public half at /.well-known/jwks.json on its MCP port.
    - secretKey: JWT_PRIVATE_KEY
      remoteRef: { key: hr-it-bot-airs-gw, property: JWT_PRIVATE_KEY }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airs-gw-registry
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target:
    name: airs-gw-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"registry.portkey.ai":{"auth":"{{ printf "%s:%s" .REGISTRY_USERNAME .REGISTRY_PASSWORD | b64enc }}"}}}'
  data:
    - secretKey: REGISTRY_USERNAME
      remoteRef: { key: hr-it-bot-airs-gw, property: REGISTRY_USERNAME }
    - secretKey: REGISTRY_PASSWORD
      remoteRef: { key: hr-it-bot-airs-gw, property: REGISTRY_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target: { name: auth }
  dataFrom:
    - extract: { key: hr-it-bot-auth }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target: { name: cloudflared }
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: { key: hr-it-bot-cloudflared, property: TUNNEL_TOKEN }
