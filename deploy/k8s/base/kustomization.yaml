apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hr-it-bot
resources:
  - namespace.yaml
  - apps.yaml
  - auth.yaml
  - cloudflared.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: caddyfile
    files: [Caddyfile]
# Every pod runs as the non-root uid 1001 the images create, with no privilege
# escalation and no capabilities (each Deployment has a single container). fsGroup
# makes mounted volumes (auth-service's SQLite, Caddy's scratch dirs) writable by it.
# Service links are off: Kubernetes would otherwise inject <SERVICE>_PORT=tcp://...
# variables, and CHATBOT_V2_PORT is the chatbot's own listen-port setting.
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
          seccompProfile: { type: RuntimeDefault }
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
# The official Caddy binary carries the cap_net_bind_service file capability; the kernel
# refuses to exec it when that capability is outside the container's bounding set.
  - target: { kind: Deployment, name: caddy }
    patch: '[{"op": "add", "path": "/spec/template/spec/containers/0/securityContext/capabilities/add", "value": ["NET_BIND_SERVICE"]}]'
