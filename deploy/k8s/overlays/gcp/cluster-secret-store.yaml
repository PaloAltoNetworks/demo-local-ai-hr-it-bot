# GCP Secret Manager, authenticated by Workload Identity Federation for GKE on the
# external-secrets ServiceAccount (IAM bindings in infra/gcp/main.tf). The deploy workflow
# replaces GCP_PROJECT with vars.GCP_PROJECT, so no project id is committed.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secrets
spec:
  provider:
    gcpsm:
      projectID: GCP_PROJECT
