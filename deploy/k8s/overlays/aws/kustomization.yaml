apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - cluster-secret-store.yaml
  - storage-class.yaml
# Public identity of this deployment: the chatbot and login hostnames routed by the
# Cloudflare tunnel to Caddy, and the auth session cookie. The prefix keeps this
# instance's cookie apart from other auth instances sharing the .panw.pro domain.
configMapGenerator:
  - name: edge
    namespace: hr-it-bot
    literals:
      - APP_HOST=otter-v3.panw.pro
      - AUTH_HOST=auth2.panw.pro
      - AUTH_COOKIE_DOMAIN=panw.pro
      - AUTH_COOKIE_PREFIX=otter-eks
      - TRUSTED_ORIGINS=https://*.panw.pro
      - ALLOWED_EMAIL_DOMAIN=paloaltonetworks.com
# The AIRS gateway resolves the SCM-registered MCP origins (*.otter-lab.com) through
# hostAlias entries in deploy/helm/airs-gw/values-aws.yaml, which point at these
# ClusterIPs inside the service CIDR pinned by infra/aws (172.20.0.0/16).
# ponytail: IPs are fixed by hand per cloud; past a handful of origins, switch to an
# in-cluster DNS rewrite.
patches:
  # The chatbot authenticates to the AI Gateway with its Idira SWA workload identity: the
  # agent's Workload API socket (DaemonSet installed from deploy/helm/swa) is mounted read-only.
  - target: { kind: Deployment, name: chatbot-v2 }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value: [{ name: swa-agent, hostPath: { path: /tmp/swa-agent, type: Directory } }]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{ name: swa-agent, mountPath: /tmp/swa-agent, readOnly: true }]
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///tmp/swa-agent/public/api.sock" }
  - target: { kind: Service, name: it-tools }
    patch: '[{"op": "add", "path": "/spec/clusterIP", "value": "172.20.200.16"}]'
  - target: { kind: Service, name: hr-tools }
    patch: '[{"op": "add", "path": "/spec/clusterIP", "value": "172.20.200.17"}]'
  - target: { kind: Service, name: it-triage }
    patch: '[{"op": "add", "path": "/spec/clusterIP", "value": "172.20.200.19"}]'
