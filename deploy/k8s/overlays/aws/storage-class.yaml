# Default storage for PersistentVolumeClaims (auth-service's SQLite). EKS Auto Mode
# ships the EBS CSI driver but no StorageClass using it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"
